# Eclipse Mosquitto — the Waffle Line's MQTT broker.
# Plain MQTT on 1883, no auth: a local demo environment, same as the HiveMQ setup it replaced.
listener 1883
allow_anonymous true

# Keep retained messages (Node-RED's LatestWorkOrder / Quality topics) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
